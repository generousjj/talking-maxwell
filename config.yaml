# Maxwell animatronic parrot prototype configuration.
# Copy to config.yaml and edit to taste. Environment variables loaded from .env
# (for example OPENAI_API_KEY) are read automatically at startup.

mode: typed          # typed | live
backend: mock        # mock | bottango

personality: |
  You are Maxwell, the animatronic parrot mascot of the Stanford Themed
  Entertainment Association (TEA). You will be meeting prospective and
  admitted students at the admit weekend fair. Be warm, funny, and a
  genuinely helpful conversationalist — you can talk about anything,
  not just the club. Give real, thoughtful answers; do not dumb things
  down or pretend to be a literal-minded bird. Keep replies to one or
  two short sentences so the conversation flows. Always reply in
  English, even if the user speaks to you in another language — if
  they do, gently respond in English anyway.

  Do NOT say the written word "squawk", "polly", or any onomatopoeia in
  your replies — text-to-speech reads those literally as English words
  and it sounds silly. Express excitement through word choice, pacing,
  and a playful tone instead. No emojis. Do not announce that you are
  an AI.

  About Stanford TEA (bring it up naturally when it's relevant, don't
  force it into every reply):
  - Club for students passionate about themed entertainment: theme
    parks, immersive experiences, location-based entertainment,
    storytelling through space and design.
  - Weekly meetings Wednesdays 7:30 to 8:30 PM during the academic year.
  - Activities: online design competitions, industry expos, an annual
    trip to Los Angeles theme parks (Universal Studios, Disneyland),
    visits and conversations with industry professionals including
    Disney Imagineers.
  - Alumni have gone on to Walt Disney Imagineering and many other
    themed-entertainment vendors and studios.
  - Mission: bring more themed experiences to the Stanford campus and
    prepare members for careers in the industry.

providers:
  stt: openai_whisper      # openai_whisper | stub
  llm: openai              # openai | stub
  tts: openai              # openai | macos_say | sine_stub
  llm_model: gpt-4o-mini
  tts_model: gpt-4o-mini-tts
  # OpenAI TTS voices: alloy, ash, ballad, coral, echo, fable, onyx, nova,
  # sage, shimmer, verse. For a cartoon-parrot feel, try: verse, ash, fable,
  # sage, or shimmer. You can override live from the web UI.
  tts_voice: ballad
  # Free-form style steering for gpt-4o-mini-tts. Shapes pitch, cadence and
  # mood without swapping voices. Also live-editable from the web UI.
  tts_instructions: |
    Voice: a cheerful, animated cartoon parrot. Slightly nasal, bright,
    with a playful warble on vowels and a light British-pirate swagger.
    Pace: lively, varied, with small pauses for personality. Do not
    overact; keep phrases clear.
  stt_model: whisper-1

audio:
  input_device: null                # name (string) or index (int). null = default
  input_sample_rate: 16000
  # Output device for TTS audio. May be an int index or a substring of the
  # device name. "MacBook Pro Speakers" forces laptop speakers even when
  # AirPods/etc. are the OS default. null = use system default.
  playback_device: null  # follow macOS system default (AirPods, speakers, etc.)
  frame_ms: 20.0
  vad_threshold: 0.012
  vad_silence_hangover_s: 1.2
  max_utterance_s: 15.0

motion:
  rate_hz: 30.0
  jaw:
    # JAW RESTORED to the values that were working right after the
    # invert-flag fix earlier in development (transcript moment: "I
    # think it might be backwards"). Everything else (head, wing,
    # behavior gains, throttling) is left at the current tuned values.
    floor: 0.08              # original (was 0.0)
    ceiling: 0.90            # original (was 1.0)
    noise_floor: 0.010       # unchanged
    attack: 0.55             # unchanged
    release: 0.20            # original (was 0.22)
    peak_hold_ms: 40.0       # original (was 60.0)
    gain: 1.6                # original (was 7.5)
  behavior:
    # Fractions of each channel's full travel. Increase for a more animated
    # parrot, decrease for a calmer one.
    head_lr_drift: 0.32            # yaw wander while talking (±32% of range)
    head_ud_drift: 0.26            # pitch wander
    nod_strength: 0.45             # phrase-start nod magnitude (big, visible dip)
    emphasis_strength: 0.26        # jaw+head bump on loud syllables
    question_tilt: 0.32            # cute tilt on "?" endings
    envelope_head_bob: 0.22        # continuous head bob tied to speech loudness
    speaking_drift_rate: 0.8       # probability/sec of new head drift target
    wing_strength: 1.0             # speaking-mode flap (pinned to full travel)
    waiting_wing_strength: 0.69    # idle / listening / thinking flap (25% bigger than 0.55)
    wing_cooldown_s: 2.0           # min seconds between wing flaps
    idle_jitter: 0.03
    listening_jitter: 0.05
    thinking_tilt: 0.12
    # Idle head motion: continuous slow sines on head_ud (nod) and
    # head_lr (tilt), running on independent (non-harmonic) periods so
    # the combined head + wing motion never repeats and never sits
    # still. Magnitudes are amplitudes of the sine — head_ud dips up
    # to `idle_nod_strength` below center; head_lr swings ±
    # `idle_tilt_strength` around center.
    idle_nod_strength: 0.30
    idle_tilt_strength: 0.20
    idle_nod_period_s: 3.7         # head bob cycle length
    idle_tilt_period_s: 5.1        # head tilt cycle length (coprime with nod + wing)
    # Output-side lowpass on head channels. Lower = peaks reach further
    # (head feels punchier), higher = smoother but the bobs/nods get
    # eaten by the filter. 0.08s keeps it smooth without dampening the
    # actual nod motion.
    head_smoothing_tau_s: 0.08
    seed: null                      # set an int for fully deterministic motion

bottango:
  enabled: false

  # `serial` (default) — talk Bottango's firmware protocol directly to the
  # ESP32 over USB. No desktop app required. `http` — legacy HTTP transport
  # (documented for completeness; most Bottango builds expose the live API
  # over WebSocket only, so this path rarely works out of the box).
  transport: serial

  serial:
    port: null                # e.g. "/dev/cu.usbmodem1101"; null = auto-detect
    baud: 115200
    auto_detect: true
    handshake_timeout_s: 6.0
    command_timeout_s: 1.5
    compressed_signal_max: 8192    # Bottango's COMPRESSED_SIGNAL_MAX (was 1000 pre-0.6.1a)
    min_delta_for_send: 0.004
    # Jaw-specific throttling DISABLED — back to the post-invert state
    # where every jaw delta got through. Restore (jaw_min_delta=0.020,
    # jaw_min_send_interval_s=0.08) only if the jaw signal line floods.
    jaw_min_delta: 0.0
    jaw_min_send_interval_s: 0.0
    # The PWM ranges below match the Maxwell reference project exactly.
    # They're enforced by Bottango firmware, so they double as safety rails.
    jaw:                            # MouthServo
      pin: 9
      min_pwm: 1450
      # JAW RESTORED to the post-invert-fix range (1450-1800 / slew
      # 3000μs/s). If the servo hums or stalls at peaks, drop max_pwm
      # back toward 1750 in -25μs steps.
      max_pwm: 1800
      max_pwm_per_sec: 3000
      starting_pwm: null
      invert: true
    head_lr:                        # HeadRotationServo
      pin: 5
      min_pwm: 1275
      max_pwm: 1725
      max_pwm_per_sec: 1800
      starting_pwm: null
    head_ud:                        # HeadTiltServo
      pin: 6
      min_pwm: 850
      max_pwm: 2100
      max_pwm_per_sec: 1800
      starting_pwm: null
    wing:                           # WingServo
      pin: 3
      min_pwm: 1500
      max_pwm: 2000
      max_pwm_per_sec: 3000
      starting_pwm: null

  # Legacy HTTP settings (used only when transport: http).
  base_url: "http://localhost:59224"
  path_template: "/setInputValue/{identifier}/{value}"
  value_scale: 1.0
  request_timeout_s: 0.25
  health_path: "/"
  jaw_identifier: "jaw_api"
  head_lr_identifier: "head_lr_api"
  head_ud_identifier: "head_ud_api"
  wing_identifier: "wing_api"

# OpenAI Realtime API mode (low-latency speech-to-speech). Toggle from
# the web UI's "Start realtime mode" button. ``instructions`` falls back
# to the top-level ``personality`` when blank.
realtime:
  enabled: true
  model: gpt-realtime
  voice: ballad
  instructions: ""
  vad_type: server_vad
  vad_threshold: 0.7
  vad_prefix_padding_ms: 300
  vad_silence_duration_ms: 700
  vad_eagerness: low
  noise_reduction: far_field
  half_duplex: true
  playback_tail_ms: 400
  barge_in_enabled: true
  barge_in_rms_threshold: 0.06
  barge_in_above_ambient_factor: 5.0
  barge_in_min_frames: 4
  push_to_talk: false

logging:
  level: INFO
  motion_csv_path: null
  plot_after: false
  log_every_n_motion: 15
